[project]
name = "url-shortener"
version = "1.0.0"
description = "URL shortener service implementation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url_shortener"]
