[package]
name = "url_shortener"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
